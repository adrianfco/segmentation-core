[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "segmentation-core"
version = "0.2.0"
description = "CPU image segmentation engine (KMeans, PFCM) with Python bindings"
requires-python = ">=3.10"

[tool.scikit-build]
build.targets = ["segmentation_core"]  # skip the C++ tests and benchmark

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
