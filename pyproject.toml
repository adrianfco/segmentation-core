[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "segmentation-core"
version = "0.1.0"
description = "CPU image segmentation engine (KMeans, PFCM) with Python bindings"
requires-python = ">=3.8"

[tool.scikit-build]
cmake.build-type = "Release"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
test-requires = "pytest"
test-command = "pytest {project}/tests/test_python_bindings.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
